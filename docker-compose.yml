services:
  recipes-api:
    build:
      context: ./recipes
    container_name: recipes-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  cookingisfun:
    build:
      context: ./CookingIsFun
    container_name: cookingisfun-frontend
    ports:
      - "3000:80"
    depends_on:
      - recipes-api
